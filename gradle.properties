org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.2,26.3)
# The Forge version must agree with the Minecraft version to get a valid artifact
neo_version=26.2.0.93
# The Forge version range can use any version of Forge as bounds or match the loader version range
neo_version_range=[26.2.0.93,)

terrablender_version=26.2.0.0.2
terrablender_version_range=[26.2.0.0.2,)

# Modrinth version ID of GeckoLib 5.5.6 for NeoForge 26.2, since GeckoLib's own maven has no 26.2 builds
geckolib_version=IEGPh4CJ
geckolib_version_range=[5.5.6,)

lithostitched_version=1.8.0-neoforge-26.2
lithostitched_version_range=[1.8.0,)


# Modrinth version ID of SmartBrainLib 2.0.3 for NeoForge 26.2, since its own maven has no 26.2 builds
smartbrainlib_version=sBdm4rDL
smartbrainlib_version_range=[2.0.3,)

# Optional, see compat/BiomePickCompat
#biomepicknchoose_version=1.0.8
#biomepicknchoose_version_range=[1.0.0,)

# Optional, see assets/vildmark/dynamiclights (data-driven entity lights need 4.x)
#lambdynamiclights_version_range=[4.0.0,)

# Dev-only compat test run (compatClient)
# Iris needs this exact Sodium version (Iris 1.11.4 depends on Sodium 0.9.2)
sodium_version=mc26.2-0.9.2-neoforge
iris_version=1.11.4+26.2-neoforge
tectonic_version=3.0.28-neoforge-26.2
# Modrinth version ID of C2ME (c2me-neoforge) 0.4.2-alpha.0.98+26.2, since its version numbers
# don't say which loader they're for
c2me_version=XpuI7aLS

# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=vildmark
# The human-readable display name for the mod.
mod_name=Vildmark
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.0.6
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.jesperandersson
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Jesper-Andersson
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Nordic themed mod
