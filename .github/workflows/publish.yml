name: Publish

# One branch per Minecraft version, named after it (1.21.1, ...). Each releases on its own, with the Minecraft version in
# the tag and the Modrinth version, so two branches can both release 1.0.4
on:
  push:
    branches: ['[0-9]*']
    # Commits that don't change the mod itself don't make a release
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
      - 'art/**'
      - 'blockbench/**'
      - '.run/**'
  workflow_dispatch:

# Two runs at once on a branch would both bump to the same version. Later pushes wait, and only the newest waiting one
# runs, since it checks out the latest commit anyway. Different branches don't wait for each other
concurrency:
  group: publish-${{ github.ref_name }}

# Modrinth and CurseForge are skipped while their project ID is empty. To publish there, fill these in and add the
# MODRINTH_TOKEN and CURSEFORGE_TOKEN repository secrets
env:
  MODRINTH_ID: ''
  MODRINTH_SLUG: ''
  CURSEFORGE_ID: ''
  CURSEFORGE_SLUG: ''

jobs:
  publish:
    # The version bump commit is pushed with GITHUB_TOKEN, which doesn't trigger workflows, but guard against a loop anyway.
    # Checks who pushed, not the message, so other commits starting with "Release" still release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the version commit and tag, create the release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # full history and tags, for the changelog

      - name: Minecraft version
        id: minecraft
        run: echo "version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Commit messages since the last release for this Minecraft version, leaving out merges, release commits and commits
      # that only touch the files the push trigger ignores
      - name: Changelog
        id: changelog
        env:
          MINECRAFT: ${{ steps.minecraft.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match "v*+$MINECRAFT" 2>/dev/null || true)
          changes=$(git log --no-merges --format='- %s' ${previous:+$previous..}HEAD -- . ':!*.md' ':!.github' ':!.gitignore' ':!art' ':!blockbench' ':!.run' | grep -v -E '^- Release [0-9]' || true)
          [ -n "$changes" ] || changes="- Maintenance release"
          {
            echo "text<<CHANGELOG_EOF"
            echo "$changes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changes since ${previous:-the first commit}:"
          echo "$changes"

      - name: Bump patch version
        id: version
        run: |
          current=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          sed -i "s/^mod_version=.*/mod_version=$next/" gradle.properties
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next+${{ steps.minecraft.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "Bumped $current -> $next"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      # Only after a successful build, so a broken build doesn't use up a version number
      - name: Commit and tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}" "${{ steps.version.outputs.tag }}"

      # A platform without a token is skipped by mc-publish, so only pass the tokens for platforms with a project ID
      - name: Publish to Modrinth and CurseForge
        id: publish
        if: env.MODRINTH_ID != '' || env.CURSEFORGE_ID != ''
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          version: ${{ steps.version.outputs.version }}+${{ steps.minecraft.outputs.version }}
          name: Nordic ${{ steps.version.outputs.version }} for ${{ steps.minecraft.outputs.version }}
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: neoforge

          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_ID != '' && secrets.MODRINTH_TOKEN || '' }}

          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_ID != '' && secrets.CURSEFORGE_TOKEN || '' }}

          files: build/libs/!(*-@(dev|sources|javadoc)).jar

      # Made here instead of by mc-publish, so the post can link to the files just uploaded to Modrinth and CurseForge
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          MINECRAFT: ${{ steps.minecraft.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          # Only the default branch's releases are marked as GitHub's latest release
          LATEST: ${{ github.ref_name == github.event.repository.default_branch }}
          CHANGES: ${{ steps.changelog.outputs.text }}
          MODRINTH_VERSION: ${{ steps.publish.outputs.modrinth-version }}
          CURSEFORGE_VERSION: ${{ steps.publish.outputs.curseforge-version }}
        run: |
          shopt -s extglob nullglob
          # The mod jar, without the sources and javadoc jars
          jars=(build/libs/!(*-@(dev|sources|javadoc)).jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected one mod jar, found: ${jars[*]}"
            exit 1
          fi
          links=""
          [ -n "$MODRINTH_VERSION" ] && links="[Modrinth](https://modrinth.com/mod/$MODRINTH_SLUG/version/$MODRINTH_VERSION)"
          [ -n "$CURSEFORGE_VERSION" ] && links="${links:+$links, }[CurseForge](https://www.curseforge.com/minecraft/mc-mods/$CURSEFORGE_SLUG/files/$CURSEFORGE_VERSION)"
          {
            echo "## Changes"
            echo
            echo "$CHANGES"
            if [ -n "$links" ]; then
              echo
              echo "## Download"
              echo
              echo "- $links"
            fi
          } > release-notes.md
          gh release create "$TAG" "${jars[@]}" \
            --title "Nordic $VERSION for $MINECRAFT" \
            --notes-file release-notes.md \
            --latest="$LATEST" \
            --verify-tag
